<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>php.rocks</title>
    <style>
        :root {
            --bg: rgb(51, 51, 51);
            --text: rgb(204, 204, 204);
            --php: #4F5B93;
            --laravel: #f53003;
            --symfony: rgb(209, 213, 219);
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
        }

        .center {
            margin: auto;
            display: flex;
            height: 100%;
            justify-content: center;
            width: fit-content;
            padding-left: 2rem;
            padding-right: 2rem;
            flex-direction: column;
            align-items: center;
        }
        

        .php💖 {
            font-size: 50pt;
            margin: 0;
        }

        .rocks {
            font-size: 128pt;
            margin: 0;
        }

        .enjoy {
            color: var(--text);
            font-style: oblique;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .it {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .line {
            border: 2px solid var(--php);
            margin-top: 2rem;
            margin-bottom: 2rem;
            width: 100%;
        }

        .laravel {
            color: var(--laravel);
        }

        .php {
            color: var(--php);
        }

        .symfony {
            color: var(--symfony);
        }
    </style>
</head>

<body>
    <div class="center">
        <h1 class="php💖">php.rocks</h1>
        <h1 class="rocks">❤️</h1>
        <hr class="line">
        <div class="it">
            <a target="_blank" class="enjoy php" href="https://php.net">https://php.net</a>
            <a target="_blank" class="enjoy laravel" href="https://laravel.com">https://laravel.com</a>
            <a target="_blank" class="enjoy symfony" href="https://symfony.com">https://symfony.com</a>
        </div>
    </div>
</body>

</html>
